<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#9ccafa">
    <title>Yuk Menemukan — Petualangan Si Kecil</title>
    <link rel="stylesheet" href="css/global.css?v=20261006-background-music">
    <link rel="stylesheet" href="css/misi1.css">
</head>
<body class="mission-select-page">
    <main class="page mission-select-screen">
        <img class="mission-select-background" src="asset/background/background.png" alt="" aria-hidden="true">

        <button class="home-button" id="homeButton" type="button" aria-label="Kembali ke menu" title="Kembali ke menu">
            <img src="asset/icon/homee.png" alt="">
        </button>

        <header class="mission-heading">
            <h1>Yuk Menemukan!</h1>
            <img class="mission-mascot" src="asset/dudu/dudu-misi1.png" alt="Dudu siap menemukan benda dengan kaca pembesar">
        </header>

        <nav class="level-list" aria-label="Pilih level">
            <button class="level-choice level-one" type="button" data-level="1" data-popup="asset/misi1/lv1-m1.png" data-destination="m1-lv1.html" aria-label="Buka level 1, Aku Mulai">
                <span class="level-art"><img src="asset/icon/lv1.png" alt=""></span>
            </button>
            <button class="level-choice level-two" type="button" data-level="2" data-popup="asset/misi1/lv2-m1.png" data-destination="m1-lv2.html" aria-label="Buka level 2, Aku Mencoba">
                <span class="level-art"><img src="asset/icon/lv2.png" alt=""></span>
            </button>
            <button class="level-choice level-three" type="button" data-level="3" data-popup="asset/misi1/lv3-m1.png" data-destination="m1-lv3.html" aria-label="Buka level 3, Aku Menjelajah">
                <span class="level-art"><img src="asset/icon/lv3.png" alt=""></span>
            </button>
        </nav>

        <dialog class="level-dialog" id="levelDialog" aria-labelledby="levelDialogTitle">
            <h2 class="visually-hidden" id="levelDialogTitle">Pratinjau level</h2>
            <img class="level-dialog-art" id="levelDialogArt" src="" alt="">
            <button class="level-start-hotspot" id="levelStart" type="button" aria-label="Mulai level"></button>
            <button class="level-dialog-close" id="levelDialogClose" type="button" aria-label="Tutup pratinjau">×</button>
        </dialog>
    </main>
    <script src="js/level-audio.js?v=20261006-apple-sound-gesture" defer></script>
    <script src="js/misi1.js" defer></script>
    <script src="js/background-music.js?v=20261006-independent-toggles" defer></script>
</body>
</html>
