<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#182131">
    <title>Petualangan Si Kecil</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pengenalan.css">
</head>
<body class="opening-page">
    <main class="page introduction-screen" aria-label="Pengenalan Petualangan Si Kecil">
        <video
            class="video-background"
            id="openingVideo"
            autoplay
            loop
            playsinline
            preload="auto"
            aria-label="Video pembuka Petualangan Si Kecil"
        >
            <source src="asset/video/video-background.mp4" type="video/mp4">
        </video>

        <div class="video-overlay" aria-hidden="true"></div>

        <!-- Area ini transparan dan diletakkan tepat di atas tombol pada video. -->
        <a
            class="opening-button"
            id="startAdventure"
            href="menu.html"
            aria-label="Mulai Petualangan"
            title="Mulai Petualangan"
        ></a>

        <button
            class="sound-button"
            id="soundButton"
            type="button"
            aria-label="Aktifkan suara video"
            title="Aktifkan suara video"
        >
            <span aria-hidden="true">🔊</span>
        </button>
        <p class="sound-hint" id="soundHint" role="status" aria-live="polite"></p>
    </main>
    <script src="js/pengenalan.js" defer></script>
</body>
</html>
